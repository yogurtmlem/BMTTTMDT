<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Đăng nhập - ShopVN</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<nav>
  <div class="logo">Shop<span>VN</span></div>
  <div class="nav-links">
    <a href="index.html">Trang chủ</a>
    <a href="products.html">Sản phẩm</a>
    <a href="search.html">Tìm kiếm</a>
    <a href="login.html">Đăng nhập</a>
    <button class="cart-btn">🛒 Giỏ hàng (0)</button>
  </div>
</nav>

<div class="login-page">
  <div class="login-card">
    <h2>Đăng nhập</h2>
    <p>Chào mừng trở lại! Vui lòng đăng nhập để tiếp tục.</p>

    <form method="POST" action="/login">
      <div class="form-group">
        <label>Tên đăng nhập</label>
        <input type="text" name="username" placeholder="Nhập tên đăng nhập" required/>
      </div>
      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" name="password" placeholder="Nhập mật khẩu" required/>
      </div>
      <button type="submit" class="login-btn">Đăng nhập</button>
    </form>

    <div class="login-footer">
      Chưa có tài khoản? <a href="#">Đăng ký ngay</a>
    </div>
  </div>
</div>

<footer>
  <p>© 2026 ShopVN. All rights reserved.</p>
  <div class="footer-links">
    <a href="#">Chính sách</a>
    <a href="#">Liên hệ</a>
    <a href="#">Hỗ trợ</a>
  </div>
</footer>
